  tools:
  - id: TOL-BOOKING-STORE
    name: Booking store
    purpose: Load and retain bookings. The contract is shared by creation, lookup, and cancellation and does not
      select a database.
    operations:
    - id: OP-BOOKING-LOAD
      name: Load booking
      purpose: Read one retained booking by code.
      inputs:
      - name: booking_code
        description: The exact code to locate.
        type: {kind: primitive, name: string}
        required: true
      outputs:
      - name: booking
        description: The retained booking with its current status.
        type: {kind: entity, ref: ENT-BOOKING}
        required: true
      conditions: [The store is available., 'Inputs described as ready entities already satisfy canonical entity
          invariants. Do not duplicate those validations inside this tool. When constructing entities from raw retained
          records, use the canonical entity hydration rules; operation-specific external conditions remain this
          tool''s responsibility.']
      guarantees: [A successful load returns one current booking., The result reflects the stored record at read
          time.]
      effects: [No persisted change.]
