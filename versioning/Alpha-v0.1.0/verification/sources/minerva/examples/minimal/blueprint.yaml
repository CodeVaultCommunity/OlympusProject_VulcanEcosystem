    owner_ref: UC-REQUEST-SUBMIT
    origin_refs: [RF-REQUEST-01]
    kind: authorization
  dependencies:
  - {id: DEP-REQUEST-SUBMIT-ENT-REQUEST, consumer_ref: UC-REQUEST-SUBMIT, provider_ref: ENT-REQUEST, relation: uses_type,
    purpose: Declared collaborator in the source case contract., context_forwarding: null}
  - {id: DEP-REQUEST-SUBMIT-TOL-REQUEST-STORE, consumer_ref: UC-REQUEST-SUBMIT, provider_ref: TOL-REQUEST-STORE,
