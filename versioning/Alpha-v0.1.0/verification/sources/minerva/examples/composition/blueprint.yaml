      listed failure with a controlled fixture, including atomic conflicts or lost acknowledgement when declared.
    actor_context: Not applicable to the tool itself; authorization belongs to the consuming case.
    action: Invoke OP-BOOKING-SAVE under success and each declared failure condition.
    expected_result: 'Success: A successful save confirms one updated retained booking.; Expected version zero means
      insert only if the identifier is absent. A positive expected version means replace only the matching retained
      version. Comparison and write are atomic; success increments the version by one.; VERSION_CONFLICT guarantees
      this operation made no change; another concurrent operation may have changed the stored record.; A successful
      save confirms the new data. Failures: VERSION_CONFLICT: This operation made no write. The existing or concurrently
      updated record is not overwritten.; STORE_UNAVAILABLE: Distinguish write_outcome=not_applied, when supported
      by a no-write guarantee, from unknown. Do not report success or automatically retry an unknown write.'
    expected_effects: 'Success: The retained booking is replaced with the supplied data. Failure effects: This operation
      made no write. The existing or concurrently updated record is not overwritten.; Distinguish write_outcome=not_applied,
      when supported by a no-write guarantee, from unknown. Do not report success or automatically retry an unknown
      write.'
    observed_boundary: Tool inputs, outcomes, canonical hydration and persisted state.
