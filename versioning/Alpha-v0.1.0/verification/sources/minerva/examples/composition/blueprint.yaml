adpm:
  types:
  - id: TYP-BOOKING-STATUS
    base: string
    constraints: [Known values are active and cancelled.]
  entities:
  - id: ENT-BOOKING
    source_entity_id: ENT-BOOKING
    name: Booking
    meaning: A booking records a named reservation and has a lifecycle status.
    fields:
    - name: booking_code
      description: 'A stable uppercase code that identifies the booking. Constraints: 1 to 12 uppercase letters
        or digits.'
      type: {kind: primitive, name: string}
      required: true
      cardinality: '1'
    - name: title
      description: 'A short human-readable title. Constraints: At least one non-whitespace character.'
      type: {kind: primitive, name: string}
      required: true
      cardinality: '1'
    - name: status
      description: 'The lifecycle state of the booking. Constraints: One of active or cancelled.'
      type: {kind: type, ref: TYP-BOOKING-STATUS}
      required: true
      cardinality: '1'
    - name: version
      description: 'Concurrency token: zero for a new ready Booking, positive for a retained Booking. Constraints:
        A non-negative integer; successful save increments it.'
      type: {kind: primitive, name: integer}
      required: true
      cardinality: '1'
    invariant_refs: [VLD-BOOKING-CODE, VLD-BOOKING-TITLE]
    construction: Canonical construction/hydration enforces all field constraints and state coherence once. Named
      transition rules apply only to their declared transition, not to every hydrated entity.
    behavior:
      summary: Preserve identity, exact data and the declared lifecycle.
      steps: ['The code is valid when it has 1 to 12 characters, all uppercase letters or digits.', A cancellation
          transition is valid only when the booking's current status is active., The title is text with at least
          one non-whitespace character. Preserve valid text exactly.]
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: [GRAPH-VLD-BOOKING-CODE, GRAPH-VLD-BOOKING-CANCEL, GRAPH-VLD-BOOKING-TITLE]
    dependencies: []
  - id: ENT-CALLER-CONTEXT
    source_entity_id: null
