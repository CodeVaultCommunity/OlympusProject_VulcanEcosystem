<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Vulcan Ecosystem · organização e registros</title>
<desc id="asset-description">Um ecossistema pode conter apps Vulcan e apps com outras arquiteturas. Contratos públicos sustentam a comunicação quando presente. L3 documenta inventário, composição, execução, integrações concretas e evidências; o espelho permanece em L2.</desc>
