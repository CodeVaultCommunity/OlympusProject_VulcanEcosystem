  - {id: DEP-REQUEST-SUBMIT-OP-REQUEST-STORE, consumer_ref: UC-REQUEST-SUBMIT, provider_ref: OP-REQUEST-STORE, relation: calls,
    purpose: Declared collaborator in the source case contract., context_forwarding: null}
  domains: []
  composition:
    selection_location: Application composition root selected by the future L3 realization.
    description: Inject contracted tools and composed cases explicitly. No concrete database, framework or global
      service lookup is prescribed.
    lifetimes:
    - {element_ref: UC-REQUEST-SUBMIT, scope: Stateless callable; invocation state belongs to the passed context.,
      ownership: The L3 composition root owns the case and injected collaborators.}
    - {element_ref: TOL-REQUEST-STORE, scope: Managed by the chosen L3 scope; persistence outlives a case call and
