  - id: OP-SOURCE-008-01-23
    code_name: testConcurrentSaveIsConditional
    contract_scope: technical
    native_signature: testConcurrentSaveIsConditional(self)
    description: Observed Python method. Operational meaning, where applicable, remains in linked ADPM; this record
      does not redefine its contract.
    inputs: []
    outputs: []
    technical_parameters: []
    behavior:
      summary: Observed lexical body; not a proof of runtime behavior.
      steps:
      - booking = self.app.create.createBooking(self.context, 'BOOK001', 'Original')
      - barrier = threading.Barrier(2)
      - "def save(title):\n    barrier.wait(timeout=5)\n    try:\n        return self.app.store.saveBooking(replace(booking,\
        \ title=title), 1)\n    except OperationFailure as error:\n        return error.code"
      - "with ThreadPoolExecutor(max_workers=2) as pool:\n    results = list(pool.map(save, ['First', 'Second']))"
      - self.assertEqual(results.count('VERSION_CONFLICT'), 1)
      - winner = next((item for item in results if item != 'VERSION_CONFLICT'))
      - self.assertEqual(winner.version, 2)
      - self.assertEqual(self.app.lookup.lookupBooking(self.context, 'BOOK001'), winner)
      preconditions: []
      postconditions: []
