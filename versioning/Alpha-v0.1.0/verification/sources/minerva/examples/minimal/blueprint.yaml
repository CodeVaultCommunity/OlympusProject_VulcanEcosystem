      Preserve the code exactly; case is significant., source_pointer: /atlas/entities/0/validations/1}
  - {ref: TOL-REQUEST-STORE, kind: tool, statement: Request store, source_pointer: /atlas/tools/0}
  - {ref: OP-REQUEST-STORE, kind: operation, statement: Store request, source_pointer: /atlas/tools/0/operations/0}
  - ref: UC-REQUEST-SUBMIT
    kind: case
    statement: Submit request
    source_pointer: /atlas/use_cases/0
    actor_refs: [ACT-REQUESTER]
  - ref: RF-REQUEST-01
    kind: requirement
    statement: The case admits only an actor with the requester permission and refuses every other actor before
      any validation, store call, or effect.
    source_pointer: /atlas/use_cases/0/functional_requirements/0
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-02
    kind: requirement
    statement: The case applies VLD-REQUEST-QUANTITY to the supplied quantity and, when the validation reports fail,
      refuses the request with the invalid-data outcome and no store call.
    source_pointer: /atlas/use_cases/0/functional_requirements/1
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-03
    kind: requirement
    statement: After a passing validation, the case calls OP-REQUEST-STORE with the code and quantity; a stored
      result produces the confirmation outcome.
    source_pointer: /atlas/use_cases/0/functional_requirements/2
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-04
    kind: requirement
    statement: 'When OP-REQUEST-STORE reports STORE_UNAVAILABLE, the case reports the store-unavailable failure
      and does not claim a confirmed request.

      Preserve whether the tool guarantees not_applied or reports unknown. A lost confirmation is not evidence of
      no write; do not automatically retry.'
    source_pointer: /atlas/use_cases/0/functional_requirements/3
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-05
    kind: requirement
    statement: A confirmed request result contains the supplied code and quantity and identifies the new record.
    source_pointer: /atlas/use_cases/0/functional_requirements/4
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-06
    kind: requirement
    statement: When OP-REQUEST-STORE reports DUPLICATE_CODE, refuse the duplicate and leave the existing request
      unchanged; do not report confirmation.
    source_pointer: /atlas/use_cases/0/functional_requirements/5
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RF-REQUEST-07
    kind: requirement
    statement: After authorization and before quantity validation, apply VLD-REQUEST-CODE. Refuse invalid code without
      storage; preserve valid code exactly.
    source_pointer: /atlas/use_cases/0/functional_requirements/6
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: RNF-REQUEST-01
    kind: requirement
    statement: For inputs within the declared field limits and an available store, the boundary presents a confirmed
      or refused result within 2 seconds of the submit stimulus.
    source_pointer: /atlas/use_cases/0/nonfunctional_requirements/0
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-01
    kind: criterion
    statement: A requester with a valid code and quantity of 2 receives a confirmed result; a later lookup of the
      code returns quantity 2.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/0
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-02
    kind: criterion
    statement: A quantity of 0 is refused as invalid data, and no record is created.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/1
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-03
    kind: criterion
    statement: An actor absent from the permitted set is refused before validation or store access.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/2
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-04
    kind: criterion
    statement: Submit the same code twice. The second attempt reports duplicate-code refusal and preserves the first
      retained quantity.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/3
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-05
    kind: criterion
    statement: If a store write has an unknown final outcome, return the failure without claiming success or no
      write and without automatic retry.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/4
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-06
    kind: criterion
    statement: An empty code is refused before quantity validation and store invocation.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/5
    case_refs: [UC-REQUEST-SUBMIT]
  - ref: AC-REQUEST-SUBMIT-QUALITY
    kind: criterion
    statement: In the declared didactic configuration, demonstrate the canonical quality criterion and its stated
      verification procedure; preserve its status as a teaching assumption, not a measured production claim.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/6
    case_refs: [UC-REQUEST-SUBMIT]
adpm:
  types: []
  entities:
  - id: ENT-REQUEST
    source_entity_id: ENT-REQUEST
    name: Request
    meaning: A request asks the register to retain a quantity of a catalog code. The request is identified by its
      code.
    fields:
    - name: request_code
      description: 'A non-empty code chosen by the requester. Constraints: The code is preserved exactly; case is
        significant.'
      type: {kind: primitive, name: string}
      required: true
      cardinality: '1'
    - name: quantity
      description: 'The number of units requested. Constraints: The value must be an integer greater than or equal
        to 1.'
      type: {kind: primitive, name: integer}
      required: true
      cardinality: '1'
    invariant_refs: [VLD-REQUEST-QUANTITY, VLD-REQUEST-CODE]
    construction: Canonical construction/hydration enforces all field constraints and state coherence once. Named
      transition rules apply only to their declared transition, not to every hydrated entity.
    behavior:
      summary: Preserve identity, exact data and the declared lifecycle.
      steps: [The quantity field is valid when its value is an integer greater than or equal to 1., The code must
          be text containing at least one character. Preserve the code exactly; case is significant.]
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: [GRAPH-VLD-REQUEST-QUANTITY, GRAPH-VLD-REQUEST-CODE]
    dependencies: []
  - id: ENT-CALLER-CONTEXT
    source_entity_id: null
    name: Caller context
    meaning: L2 invocation data, distinct from business inputs and injected tools.
    fields:
    - name: principal
      description: Authenticated concrete caller identity.
      type: {kind: primitive, name: string}
      required: true
    - name: issuer
      description: Trusted context issuer.
      type: {kind: primitive, name: string}
      required: true
    - name: valid
      description: Context is resolved, known and unexpired.
      type: {kind: primitive, name: boolean}
      required: true
    - name: permissions
      description: Case permissions from the trusted authority.
      type:
        kind: array
        items: {kind: primitive, name: string}
      required: true
    invariant_refs: [RULE-CALLER-CONTEXT]
    construction: Created by the selected trusted authority; a matching request shape does not establish trust.
    behavior:
      summary: Carry caller identity and grants; each case decides its own authorization.
      steps: []
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: []
    dependencies: []
  tools:
  - id: TOL-REQUEST-STORE
    name: Request store
    purpose: Retain request records durably. The contract does not choose a database, transport, or file layout.
    operations:
    - id: OP-REQUEST-STORE
      name: Store request
      purpose: Create one retained request record when its code is unused.
      inputs:
      - name: request_code
        description: The code to retain.
        type: {kind: primitive, name: string}
        required: true
      - name: quantity
        description: An already validated positive integer.
        type: {kind: primitive, name: integer}
        required: true
      outputs:
      - name: stored_request
        description: The retained request with its code and quantity.
        type: {kind: entity, ref: ENT-REQUEST}
        required: true
      conditions: [The code is not allocated to a retained request., The store is available., 'Inputs described
          as ready entities already satisfy canonical entity invariants. Do not duplicate those validations inside
          this tool. When constructing entities from raw retained records, use the canonical entity hydration rules;
          operation-specific external conditions remain this tool''s responsibility.']
      guarantees: [A successful result confirms one retained record., A duplicate-code failure leaves the existing
          record unchanged., 'After a successful result, the record is readable by code in the same retained store.']
      effects: [One request record is added to the retained store.]
      failures:
      - {id: FAIL-OP-REQUEST-STORE-DUPLICATE-CODE, condition: The code is already allocated., result: 'DUPLICATE_CODE:
          The consumer must distinguish this from a successful store and from an unavailable store.', effects: The
          consumer must distinguish this from a successful store and from an unavailable store., outcome_certainty: not_applied}
      - {id: FAIL-OP-REQUEST-STORE-STORE-UNAVAILABLE, condition: The store did not confirm the write., result: 'STORE_UNAVAILABLE:
          Return write_outcome=not_applied only when the tool can guarantee no write; otherwise return write_outcome=unknown.
          Neither outcome is confirmation. An unknown outcome must not trigger an automatic retry.', effects: Return
          write_outcome=not_applied only when the tool can guarantee no write; otherwise return write_outcome=unknown.
          Neither outcome is confirmation. An unknown outcome must not trigger an automatic retry., outcome_certainty: unknown}
      ready_entity_assumption: Ready entities already satisfy canonical invariants. Validated scalar inputs retain
        their preconditions; no duplicate domain validation in this tool.
      canonical_construction_refs: []
      revalidates_rule_refs: []
      contextual_conditions:
      - {id: CTX-OP-REQUEST-STORE, condition: 'A successful result confirms one retained record.

          A duplicate-code failure leaves the existing record unchanged.', object: The persisted identifier and
          any expected version., purpose: Enforce atomic external storage conditions without repeating ready-entity
          validity., responsibility: OP-REQUEST-STORE}
    dependencies: [ENT-REQUEST]
    technical_selection: Unselected; the future realization must meet this contract.
  cases:
  - id: UC-REQUEST-SUBMIT
    source_case_id: UC-REQUEST-SUBMIT
    app: RequestRegister
    name: Submit request
    objective: Retain one valid request and confirm the stored record.
    inputs:
    - name: actor_context
      description: 'One request is submitted against the single request register.

        Caller context must contain a resolved authenticated principal, the relevant case permissions, and a validity
        status. Its origin is the application''s trusted identity-and-permission authority; request fields and caller-supplied
        role strings are not trusted authorization evidence. Anonymous execution is not permitted. Missing, unresolved,
        expired or insufficient context is denied before any validation, tool access or effect.

        The initiating actor is ACT-REQUESTER. The actor is a role; the caller is the concrete principal. The identity/authentication
        mechanism and channel encoding remain later design decisions.'
      type: {kind: entity, ref: ENT-CALLER-CONTEXT, nullable: true}
      required: true
    - name: request_code
      description: The code that identifies the request.
      type: {kind: primitive, name: string}
      required: true
    - name: quantity
      description: The number of units requested.
      type: {kind: primitive, name: integer}
      required: true
    outputs:
    - name: result
      description: The request is retained and confirmed.
      type: {kind: entity, ref: ENT-REQUEST}
      required: true
    collaborators: [ENT-REQUEST, TOL-REQUEST-STORE, OP-REQUEST-STORE]
    rule_refs: [RULE-REQUEST-SUBMIT-AUTH, VLD-REQUEST-QUANTITY, VLD-REQUEST-CODE]
    permission:
      context_input: actor_context
      trust_source: 'One request is submitted against the single request register.

        Caller context must contain a resolved authenticated principal, the relevant case permissions, and a validity
        status. Its origin is the application''s trusted identity-and-permission authority; request fields and caller-supplied
        role strings are not trusted authorization evidence. Anonymous execution is not permitted. Missing, unresolved,
        expired or insufficient context is denied before any validation, tool access or effect.

        The initiating actor is ACT-REQUESTER. The actor is a role; the caller is the concrete principal. The identity/authentication
        mechanism and channel encoding remain later design decisions.'
      required_permissions: [Permitted to submit requests.]
      allowed_actor_refs: [ACT-REQUESTER]
      deny_contexts: [absent, unresolved, unknown, insufficient]
      anonymous_allowed: false
      authentication: Authenticated, resolved, known and unexpired principal required; channel mechanism remains
        unselected.
      before_effects: true
    behavior:
      summary: Retain one valid request and confirm the stored record.
      steps: ['Start: the case receives the request and actor. If the actor is not permitted, refuse with no effects
          (RF-REQUEST-01).', Apply VLD-REQUEST-CODE before the quantity check. An invalid code is refused without
          storage (RF-REQUEST-07)., Apply VLD-REQUEST-QUANTITY (RF-REQUEST-02). A fail result refuses the request
          as invalid data., 'On pass, call OP-REQUEST-STORE (RF-REQUEST-03). A stored result produces the confirmed
          outcome (RF-REQUEST-05). STORE_UNAVAILABLE produces the store-unavailable failure (RF-REQUEST-04).', DUPLICATE_CODE
          is the duplicate refusal with no change to the preexisting request (RF-REQUEST-06). A write failure retains
          its known-not-applied versus unknown distinction (RF-REQUEST-04).]
      preconditions: [Requests may arrive without valid caller context; the explicit denial path handles them before
          any collaborator is invoked.]
      postconditions: ['On OUT-REQUEST-CONFIRMED: The request is retained and confirmed.', 'On OUT-REQUEST-INVALID:
          The code or quantity is invalid; the request is refused.', 'On OUT-REQUEST-DENIED: The actor is absent
          or not permitted.', 'On OUT-REQUEST-STORE-FAILURE: The store reports that it is unavailable.', 'On OUT-REQUEST-DUPLICATE:
          The request code is already retained.']
      effects: ['On OUT-REQUEST-CONFIRMED: One new request record exists in the store.', 'On OUT-REQUEST-INVALID:
          No store call and no retained record.', 'On OUT-REQUEST-DENIED: No validation, store call, or retained
          record.', 'On OUT-REQUEST-STORE-FAILURE: No confirmed request is reported.', 'On OUT-REQUEST-DUPLICATE:
          This invocation leaves the existing request unchanged.']
      graph_refs: [GRAPH-REQUEST-SUBMIT]
    failures:
    - {id: OUT-REQUEST-INVALID, condition: The code or quantity is invalid; the request is refused., result: OUT-REQUEST-INVALID,
      effects: No store call and no retained record., outcome_certainty: not_applied}
    - {id: OUT-REQUEST-DENIED, condition: The actor is absent or not permitted., result: OUT-REQUEST-DENIED, effects: 'No
        validation, store call, or retained record.', outcome_certainty: not_applied}
    - {id: OUT-REQUEST-STORE-FAILURE, condition: The store reports that it is unavailable., result: OUT-REQUEST-STORE-FAILURE,
      effects: No confirmed request is reported., outcome_certainty: unknown}
    - {id: OUT-REQUEST-DUPLICATE, condition: The request code is already retained., result: OUT-REQUEST-DUPLICATE,
      effects: This invocation leaves the existing request unchanged., outcome_certainty: not_applied}
    domain_ref: null
  rules:
  - id: VLD-REQUEST-QUANTITY
    statement: 'The quantity field is valid when its value is an integer greater than or equal to 1. Conditions:
      The value is an integer.; The value is at least 1.'
    owner_ref: ENT-REQUEST
    origin_refs: [VLD-REQUEST-QUANTITY]
    kind: invariant
  - id: VLD-REQUEST-CODE
