adpm:
  types: []
  entities:
  - id: ENT-TASK
    source_entity_id: ENT-TASK
    name: Task
    meaning: An identified item retained in the shared local task list.
    fields:
    - name: task_id
      type:
        kind: primitive
        name: string
      description: Stable generated identity.
      required: true
    - name: title
      type:
        kind: primitive
        name: string
      description: Canonical stripped title.
      required: true
    - name: completed
      type:
        kind: primitive
        name: boolean
      description: Whether the task is completed.
      required: true
    invariant_refs:
    - RULE-TASK-ID
    - RULE-TASK-TITLE
    - RULE-TASK-COMPLETED
    construction: Entity_Task constructs its internal ValueObject_TaskTitle. The tool uses that canonical construction
      for raw inputs and hydration.
    behavior:
      summary: Preserve identity and title; complete changes pending to completed and repeating completion keeps
        the same state.
      steps: []
      preconditions: []
      postconditions: []
      effects: []
      graph_refs:
      - GRAPH-TASK-STATE
    dependencies: []
  - id: ENT-ACTOR-CONTEXT
    source_entity_id: null
    name: Actor context
    meaning: Local implementation representation of trusted caller context; never trusted merely because it appears
      in request JSON.
    fields:
    - name: actor_id
      type:
        kind: primitive
        name: string
        nullable: true
      description: Resolved caller identity or explicit absence.
      required: true
    - name: permissions
      type:
        kind: array
        items:
          kind: primitive
          name: string
      description: Trusted permissions supplied by the selected resolver.
      required: true
    - name: resolution
      type:
        kind: primitive
        name: string
      description: Resolution state.
      required: true
    - name: known_actor
      type:
        kind: primitive
        name: boolean
      description: Whether the caller is recognized.
      required: true
    invariant_refs:
    - RULE-ACTOR-CONTEXT
    construction: Entity_ActorContext applies canonical field-type validation. Each case still checks whether the
      context authorizes its operation.
    behavior:
      summary: Represent trusted context; canPerform requires resolved, known, nonblank identity and the requested
        permission.
      steps: []
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: []
    dependencies: []
  tools:
  - id: TOL-TASK-STORE
    name: Task persistence capability
    purpose: Provide task persistence under declared local storage semantics.
    operations:
    - id: OP-TASK-CREATE
      name: Create task
      purpose: Generate a UUID4 hex identity, construct a valid Task and retain it.
      inputs:
      - name: title
        type:
          kind: primitive
          name: string
        description: Raw title to be canonically constructed.
        required: true
      outputs:
      - name: task
        type:
          kind: entity
          ref: ENT-TASK
        description: The new retained Task.
        required: true
      conditions:
      - The selected persistence resource is prepared by composition.
      guarantees:
      - The canonical entity exists before insertion.
      - A confirmed result remains readable after normal reopen of the same database.
      effects:
      - Insert exactly one new task on confirmed success.
      failures:
      - id: FAIL-STORE-CREATE
        condition: Storage or filesystem operation fails.
        result: Propagate the storage failure; no automatic retry.
        effects: Failure does not establish whether a write was applied.
        outcome_certainty: unknown
      ready_entity_assumption: A ready Task satisfies RULE-TASK-ID, RULE-TASK-TITLE and RULE-TASK-COMPLETED; raw
        rows and raw title are constructed canonically.
      canonical_construction_refs:
      - ENT-TASK
      revalidates_rule_refs: []
      contextual_conditions: []
    - id: OP-TASK-LIST
      name: List task
      purpose: Read and canonically hydrate retained tasks.
      inputs: []
      outputs:
      - name: tasks
        type:
          kind: array
          items:
            kind: entity
            ref: ENT-TASK
        description: Tasks in insertion order.
        required: true
      conditions:
      - The selected persistence resource is prepared by composition.
      guarantees:
      - An empty store returns an empty collection.
      - Order is insertion order, not UUID sort.
      effects: []
      failures:
      - id: FAIL-STORE-LIST
        condition: Storage or filesystem operation fails.
        result: Propagate the storage failure; no automatic retry.
        effects: No domain write is requested.
        outcome_certainty: not_applicable
      ready_entity_assumption: A ready Task satisfies RULE-TASK-ID, RULE-TASK-TITLE and RULE-TASK-COMPLETED; raw
        rows and raw title are constructed canonically.
      canonical_construction_refs:
      - ENT-TASK
      revalidates_rule_refs: []
      contextual_conditions: []
    - id: OP-TASK-GET
      name: Get task
      purpose: Read one retained task by identity.
      inputs:
      - name: task_id
        type:
          kind: primitive
          name: string
        description: Identity to look up.
        required: true
      outputs:
      - name: task
        type:
          kind: entity
          ref: ENT-TASK
          nullable: true
        description: Task or absence.
        required: true
      conditions:
      - The selected persistence resource is prepared by composition.
      guarantees:
      - Return absence when identity is not retained.
      effects: []
      failures:
      - id: FAIL-STORE-GET
        condition: Storage or filesystem operation fails.
        result: Propagate the storage failure; no automatic retry.
        effects: No domain write is requested.
        outcome_certainty: not_applicable
      ready_entity_assumption: A ready Task satisfies RULE-TASK-ID, RULE-TASK-TITLE and RULE-TASK-COMPLETED; raw
        rows and raw title are constructed canonically.
      canonical_construction_refs:
      - ENT-TASK
      revalidates_rule_refs: []
      contextual_conditions: []
    - id: OP-TASK-SAVE
      name: Save task
      purpose: Persist the supplied ready entity.
      inputs:
      - name: task
        type:
          kind: entity
          ref: ENT-TASK
        description: Already valid Task.
        required: true
      outputs:
      - name: task
        type:
          kind: entity
          ref: ENT-TASK
        description: Task after confirmed update.
        required: true
      conditions:
      - The selected persistence resource is prepared by composition.
      guarantees:
      - Ready entity invariants are assumed and not revalidated.
      - A missing retained row produces LookupError.
      effects:
      - Update the matching retained row.
      failures:
      - id: FAIL-STORE-SAVE
        condition: Storage or filesystem operation fails.
        result: Propagate the storage failure; no automatic retry.
        effects: Failure does not establish whether a write was applied.
        outcome_certainty: unknown
      ready_entity_assumption: A ready Task satisfies RULE-TASK-ID, RULE-TASK-TITLE and RULE-TASK-COMPLETED; raw
        rows and raw title are constructed canonically.
      canonical_construction_refs: []
      revalidates_rule_refs: []
      contextual_conditions:
      - id: COND-SAVE-ROW
        condition: Exactly one retained row must match the supplied identity.
        object: persistent row
        purpose: Distinguish update success from absence.
        responsibility: Persistence capability evaluates affected row count.
    dependencies: []
    technical_selection: Vulcan AppComposition selects Tool_SqliteTaskStore; the logical contract does not require
      a Python base class or a database brand.
  cases:
  - id: UC-TASK-001
    source_case_id: UC-TASK-001
    app: TaskBoard
    name: Create task
    objective: Create task while preserving the reconstructed demo contract.
    inputs:
    - name: actor_context
      type:
        kind: entity
        ref: ENT-ACTOR-CONTEXT
        nullable: true
      description: Invocation context supplied by the trusted resolver or explicit absence; this is not a business
        payload field.
      required: true
    - name: title
      type:
        kind: primitive
        name: string
      description: Raw title supplied by the caller.
      required: true
    outputs:
    - name: task
      type:
        kind: entity
        ref: ENT-TASK
      description: Created task.
      required: true
    collaborators:
    - TOL-TASK-STORE
    - OP-TASK-CREATE
    - ENT-TASK
    - ENT-ACTOR-CONTEXT
    rule_refs:
    - RULE-TASK-001-AUTH
    permission:
      context_input: actor_context
      trust_source: Declared local resolver maps configured opaque demo tokens to fixed caller contexts; direct
        callers supply a trusted context under this explicit trust assumption.
      required_permissions:
      - tasks:create
      allowed_actor_refs:
      - ACT-TASK-USER
      deny_contexts:
      - absent
      - unresolved
      - unknown
      - insufficient
      anonymous_allowed: false
      authentication: This local demonstration resolves configured opaque credentials; it does not claim production
        identity infrastructure.
      before_effects: true
    behavior:
      summary: Create task under the selected capability contract.
      steps:
      - Authorize the supplied context.
      - Invoke OP-TASK-CREATE; the capability generates identity and performs canonical construction before storage.
      - Return the retained entity or propagate the documented refusal/failure.
      preconditions: []
      postconditions: []
      effects:
      - A confirmed creation retains one new task.
      graph_refs:
      - GRAPH-TASK-001
    failures:
    - id: FAIL-TASK-001-AUTH
      condition: Context absent, unresolved, unknown or insufficient.
      result: PermissionError.
      effects: No task capability is called.
      outcome_certainty: not_applied
    - id: FAIL-TASK-001-STORE
      condition: A selected persistence operation fails.
      result: Propagate the failure.
      effects: Do not infer a successful write or safe retry from an unavailable result.
      outcome_certainty: unknown
    - id: FAIL-TASK-001-DATA
      condition: Raw title or task identity violates the declared data contract.
      result: ValueError or LookupError according to the condition.
      effects: No forbidden domain mutation.
      outcome_certainty: not_applied
    domain_ref: DOMAIN-TASK-MANAGEMENT
  - id: UC-TASK-002
    source_case_id: UC-TASK-002
    app: TaskBoard
    name: List tasks
