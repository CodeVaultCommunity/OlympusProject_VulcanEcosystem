[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "olympus-vulcan-reference"
version = "0.1.0a0"
description = "Vulcan Ecosystem Alpha-v0.1.0 — executable OAL L3 reference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["PyYAML==6.0.3", "jsonschema==4.25.1"]

[tool.setuptools]
py-modules = []

[tool.vulcan]
edition = "Alpha-v0.1.0"
source-distribution = true
execution-entry = "run_examples.py"
