<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1200" viewBox="0 0 1400 1200" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Vulcan Ecosystem · organization and records</title>
<desc id="asset-description">An ecosystem may contain Vulcan applications and applications with other architectures. Public contracts support communication when present. L3 records inventory, composition, execution, concrete integrations and evidence; the mirror stays in L2.</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#297fbb"/></marker>
<linearGradient id="brand-title"><stop offset="0" stop-color="#ffffff"/><stop offset=".56" stop-color="#e6faff"/><stop offset="1" stop-color="#67dbfa"/></linearGradient>
</defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><g><rect x="60" y="35" width="1280" height="140" rx="18" fill="#0b1d36" stroke="#009db8" stroke-width="2.5"/><g transform="translate(100 61) scale(0.95)" fill="none" stroke="#80e8ef" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="11" height="11" rx="2"/><rect x="26" y="3" width="11" height="11" rx="2"/><rect x="15" y="27" width="11" height="11" rx="2"/><path d="M8.5 14v7H31.5v-7 M20.5 21v6"/></g><text x="157" y="91" font-size="30" fill="#80e8ef" font-weight="700" text-anchor="start" >Vulcan Ecosystem · apps/</text><text x="100" y="138" font-size="25" fill="#e4f2ff" font-weight="400" text-anchor="start" >Each application declares its architecture, language and execution modes.</text><path d="M420 176V230H365V278" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M980 176V230H1035V278" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="240.0" y="208" width="250" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="365" y="235" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Selected profile</text><rect x="900.0" y="208" width="270" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="1035" y="235" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Existing application</text><rect x="60" y="290" width="610" height="275" rx="18" fill="#ffffff" stroke="#9cc9df" stroke-width="2.5"/><g transform="translate(90 313) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m13 8-10 12 10 12 M27 8l10 12-10 12 M24 3l-8 34"/></g><text x="147" y="343" font-size="25" fill="#1576cb" font-weight="700" text-anchor="start" >App A · Vulcan Architecture</text><text x="90" y="395" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Use cases grouped by domain.</text><text x="90" y="433" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Tools · entities · value objects.</text><text x="90" y="471" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Explicit composition; optional libraries.</text><text x="90" y="509" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >One main class/struct per file.</text><rect x="730" y="290" width="610" height="275" rx="18" fill="#f0fcfc" stroke="#8acfd2" stroke-width="2.5"/><g transform="translate(760 313) scale(0.95)" fill="none" stroke="#007786" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="10" width="34" height="26" rx="3"/><path d="M13 10V4h14v6 M3 21h34 M17 18h6v7h-6Z"/></g><text x="817" y="343" font-size="25" fill="#007786" font-weight="700" text-anchor="start" >App B · Another architecture</text><text x="760" y="395" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Existing or newly developed application.</text><text x="760" y="433" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Its own language and internal design.</text><text x="760" y="471" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Public contracts and execution declared.</text><text x="760" y="509" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Conformance scoped to its adopted profile.</text><path d="M365 566V610H500V647" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M1035 566V610H900V647" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="310" y="660" width="780" height="105" rx="18" fill="#f0fcfc" stroke="#8acfd2" stroke-width="2.5"/><text x="700" y="700" font-size="25" fill="#007786" font-weight="700" text-anchor="middle" >Public integration, when present</text><text x="700" y="739" font-size="21" fill="#15314f" font-weight="400" text-anchor="middle" >Declared contracts; interaction mappings retain their L4 identity.</text><path d="M700 766V847" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="550.0" y="786" width="300" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="813" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Record and reference</text><rect x="60" y="860" width="1280" height="230" rx="18" fill="#eef8ff" stroke="#80bddb" stroke-width="2.5"/><g transform="translate(95 886) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h24v34H8Z M14 12h12 M14 19h12 M14 27l4 4 8-9"/></g><text x="152" y="916" font-size="28" fill="#1576cb" font-weight="700" text-anchor="start" >Concrete realization records · L3</text><text x="95" y="963" font-size="24" fill="#007786" font-weight="400" text-anchor="start" font-family="DejaVu Sans Mono,monospace">docs/L3_Vulcan/</text><text x="95" y="1008" font-size="24" fill="#15314f" font-weight="400" text-anchor="start" >App inventory and profiles · composition and technical decisions.</text><text x="95" y="1045" font-size="24" fill="#15314f" font-weight="400" text-anchor="start" >Modes and commands · selected integrations · execution evidence.</text><rect x="60" y="1120" width="1280" height="50" rx="14" fill="#f8fcff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="1152" font-size="21" fill="#415e78" font-weight="400" text-anchor="middle" >Recommended location: docs/L3_Vulcan/ · per-file blueprints stay in L2.</text></g></g>
