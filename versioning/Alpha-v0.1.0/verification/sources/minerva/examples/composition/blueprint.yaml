          an unavailable store., outcome_certainty: not_applicable}
      - {id: FAIL-OP-BOOKING-LOAD-STORE-UNAVAILABLE, condition: The store could not complete the read., result: 'STORE_UNAVAILABLE:
          Must not be reported as not found.', effects: Must not be reported as not found., outcome_certainty: not_applicable}
      ready_entity_assumption: Ready entities already satisfy canonical invariants. Validated scalar inputs retain
        their preconditions; no duplicate domain validation in this tool.
      canonical_construction_refs: [ENT-BOOKING]
      revalidates_rule_refs: []
      contextual_conditions: []
    - id: OP-BOOKING-SAVE
      name: Save booking
      purpose: Persist the current data of one booking.
      inputs:
      - name: booking
        description: The booking to persist, including its status.
        type: {kind: entity, ref: ENT-BOOKING}
        required: true
      - name: expected_version
        description: The version observed by the caller.
        type: {kind: primitive, name: integer}
        required: true
      outputs:
      - name: saved_booking
        description: The booking with an incremented version.
        type: {kind: entity, ref: ENT-BOOKING}
        required: true
      conditions: [The store is available., 'Inputs described as ready entities already satisfy canonical entity
          invariants. Do not duplicate those validations inside this tool. When constructing entities from raw retained
          records, use the canonical entity hydration rules; operation-specific external conditions remain this
          tool''s responsibility.']
      guarantees: [A successful save confirms one updated retained booking., Expected version zero means insert
