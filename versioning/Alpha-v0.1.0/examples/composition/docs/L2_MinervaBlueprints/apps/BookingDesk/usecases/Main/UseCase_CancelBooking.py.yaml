      - booking = self.lookup_case.lookupBooking(actor_context, booking_code)
      - "if booking.status == 'cancelled':\n    raise OperationFailure('ALREADY_CANCELLED')"
      - return self.store.saveBooking(booking.cancel(), booking.version)
