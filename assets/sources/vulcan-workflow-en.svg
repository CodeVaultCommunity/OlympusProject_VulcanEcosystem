<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1400" height="1230" viewBox="0 0 1400 1230" role="img" aria-labelledby="asset-title asset-description">
<title id="asset-title">Vulcan Ecosystem · workflow</title>
<desc id="asset-description">Proposed workflow: versioned inputs, modeling or realization, explicit review, execution and evidence. The dashed return denotes review of differences or impacts, never automatic changes to contracts.</desc>
<defs>
<marker id="arrow" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L11 6 L1 11 Z" fill="#297fbb"/></marker>
<linearGradient id="brand-title"><stop offset="0" stop-color="#ffffff"/><stop offset=".56" stop-color="#e6faff"/><stop offset="1" stop-color="#67dbfa"/></linearGradient>
</defs>
<g font-family="DejaVu Sans,Arial,sans-serif"><g><rect x="300" y="30" width="1000" height="145" rx="18" fill="#eef8ff" stroke="#80bddb" stroke-width="2.5"/><g transform="translate(335 56) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3H25l8 8v26H9Z M25 3v9h8 M15 19h12 M15 25h12 M15 31h8"/></g><text x="392" y="86" font-size="27" fill="#1576cb" font-weight="700" text-anchor="start" >Selected blueprints and contracts · L2</text><text x="335" y="136" font-size="23" fill="#15314f" font-weight="400" text-anchor="start" >Minerva, when adopted: model, ADVS, declared versions and scope.</text><path d="M800 176V262" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="660.0" y="199" width="280" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="800" y="226" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Versioned input</text><rect x="300" y="275" width="1000" height="175" rx="18" fill="#0b1d36" stroke="#009db8" stroke-width="2.5"/><g transform="translate(335 303) scale(0.95)" fill="none" stroke="#80e8ef" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m13 8-10 12 10 12 M27 8l10 12-10 12 M24 3l-8 34"/></g><text x="392" y="333" font-size="29" fill="#80e8ef" font-weight="700" text-anchor="start" >Implement and compose · L3</text><text x="335" y="382" font-size="23" fill="#e4f2ff" font-weight="400" text-anchor="start" >Apply profiles; compose concrete tools and resources.</text><text x="335" y="419" font-size="23" fill="#e4f2ff" font-weight="400" text-anchor="start" >Preserve contracts, authorization and observable effects.</text><path d="M800 451V542" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="670.0" y="476" width="260" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="800" y="503" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Explicit review</text><rect x="300" y="555" width="1000" height="145" rx="18" fill="#ffffff" stroke="#9cc9df" stroke-width="2.5"/><g transform="translate(335 579) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M24 4a10 10 0 0 0-11 13L3 27a6 6 0 0 0 9 9l10-10A10 10 0 0 0 36 15l-9 7-8-8Z"/></g><text x="392" y="609" font-size="27" fill="#1576cb" font-weight="700" text-anchor="start" >Select applications and execution modes</text><text x="335" y="654" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Declared launcher, configuration and startup dependencies.</text><text x="335" y="686" font-size="23" fill="#415e78" font-weight="400" text-anchor="start" >Readiness and shutdown belong to the selected mode.</text><path d="M800 701V748H535V787" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="655.0" y="728" width="290" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="800" y="755" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Declared realization</text><rect x="300" y="800" width="470" height="230" rx="18" fill="#f0fcfc" stroke="#8acfd2" stroke-width="2.5"/><g transform="translate(330 825) scale(0.95)" fill="none" stroke="#007786" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="20" r="17"/><path d="m11 20 6 7 13-15"/></g><text x="387" y="855" font-size="25" fill="#007786" font-weight="700" text-anchor="start" >Run and verify</text><text x="330" y="906" font-size="22" fill="#15314f" font-weight="400" text-anchor="start" >Tests derived from ADVS.</text><text x="330" y="943" font-size="22" fill="#15314f" font-weight="400" text-anchor="start" >Core and public mappings</text><text x="330" y="980" font-size="22" fill="#15314f" font-weight="400" text-anchor="start" >checked in the declared scope.</text><path d="M771 921H856" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><rect x="772.0" y="856" width="96" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="820" y="883" font-size="18" fill="#15314f" font-weight="400" text-anchor="middle" >Output</text><rect x="870" y="800" width="430" height="230" rx="18" fill="#eef8ff" stroke="#80bddb" stroke-width="2.5"/><g transform="translate(900 825) scale(0.95)" fill="none" stroke="#1576cb" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3h24v34H8Z M14 12h12 M14 19h12 M14 27l4 4 8-9"/></g><text x="957" y="855" font-size="23" fill="#1576cb" font-weight="700" text-anchor="start" >Record evidence</text><text x="900" y="906" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Revision, environment, commands.</text><text x="900" y="943" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >Results and limits.</text><text x="900" y="980" font-size="21" fill="#15314f" font-weight="400" text-anchor="start" >docs/L3_Vulcan/evidence/</text><path d="M1085 1031V1100H150V103H286" fill="none" stroke="#297fbb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" stroke-dasharray="10 8"/><rect x="30.0" y="570" width="240" height="40" rx="10" fill="#f4fbff" stroke="#c4dfed" stroke-width="2"/><text x="150" y="597" font-size="20" fill="#15314f" font-weight="400" text-anchor="middle" >Review impact</text><rect x="60" y="1140" width="1280" height="55" rx="14" fill="#f8fcff" stroke="#c4dfed" stroke-width="2"/><text x="700" y="1175" font-size="21" fill="#415e78" font-weight="400" text-anchor="middle" >Evidence describes observations; the verification plan keeps its identity in L2.</text></g></g>
