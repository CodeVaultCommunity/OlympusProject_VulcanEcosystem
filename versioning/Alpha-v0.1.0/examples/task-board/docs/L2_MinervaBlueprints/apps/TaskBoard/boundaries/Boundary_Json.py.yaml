      - context = self.composition.resolveActor(token)
      - "try:\n    if operation == 'create':\n        result = self.composition.create.createTask(context, payload.get('task_id'),\
        \ payload.get('title'))\n    elif operation == 'complete':\n        result = self.composition.complete.completeTask(context,\
        \ payload.get('task_id'))\n    elif operation == 'list':\n        result = self.composition.list.listTasks(context)\n\
        \    else:\n        return (404, {'error': 'UNKNOWN_OPERATION'})\n    body = [asdict(item) for item in result]\
        \ if isinstance(result, list) else asdict(result)\n    return (200, {'result': body})\nexcept OperationFailure\
        \ as error:\n    status = 403 if error.code == 'DENIED' else 503 if error.code == 'STORE_UNAVAILABLE' else\
        \ 500 if error.code == 'STORE_INVALID_STATE' else 409\n    body = {'error': error.code}\n    if error.code\
        \ == 'STORE_UNAVAILABLE':\n        body['write_outcome'] = error.write_outcome\n    return (status, body)\n\
        except ValueError as error:\n    return (400, {'error': 'INVALID_INPUT', 'detail': str(error)})"
