      required_permissions:
      - tasks:read
      allowed_actor_refs:
      - ACT-TASK-USER
      deny_contexts:
      - absent
      - unresolved
      - unknown
      - insufficient
      anonymous_allowed: false
      authentication: This local demonstration resolves configured opaque credentials; it does not claim production
        identity infrastructure.
      before_effects: true
    behavior:
      summary: List tasks under the selected capability contract.
      steps:
      - Authorize the supplied context.
      - Invoke OP-TASK-LIST.
      - Return the collection, including an empty collection.
      preconditions: []
      postconditions: []
      effects: []
      graph_refs:
      - GRAPH-TASK-002
    failures:
    - id: FAIL-TASK-002-AUTH
      condition: Context absent, unresolved, unknown or insufficient.
      result: PermissionError.
      effects: No task capability is called.
      outcome_certainty: not_applied
    - id: FAIL-TASK-002-STORE
      condition: A selected persistence operation fails.
      result: Propagate the failure.
      effects: Do not infer a successful write or safe retry from an unavailable result.
      outcome_certainty: unknown
    domain_ref: DOMAIN-TASK-MANAGEMENT
  - id: UC-TASK-003
    source_case_id: UC-TASK-003
    app: TaskBoard
    name: Complete task
    objective: Complete task while preserving the reconstructed demo contract.
    inputs:
    - name: actor_context
      type:
        kind: entity
        ref: ENT-ACTOR-CONTEXT
        nullable: true
      description: Invocation context supplied by the trusted resolver or explicit absence; this is not a business
        payload field.
      required: true
    - name: task_id
      type:
        kind: primitive
        name: string
      description: Nonempty text identity.
      required: true
    outputs:
    - name: task
      type:
        kind: entity
        ref: ENT-TASK
      description: Completed task.
      required: true
    collaborators:
    - TOL-TASK-STORE
    - OP-TASK-GET
    - OP-TASK-SAVE
    - ENT-TASK
    - ENT-ACTOR-CONTEXT
    rule_refs:
    - RULE-TASK-003-AUTH
    permission:
      context_input: actor_context
      trust_source: Declared local resolver maps configured opaque demo tokens to fixed caller contexts; direct
        callers supply a trusted context under this explicit trust assumption.
      required_permissions:
      - tasks:complete
      allowed_actor_refs:
      - ACT-TASK-USER
      deny_contexts:
      - absent
      - unresolved
      - unknown
      - insufficient
      anonymous_allowed: false
      authentication: This local demonstration resolves configured opaque credentials; it does not claim production
        identity infrastructure.
      before_effects: true
    behavior:
      summary: Complete task under the selected capability contract.
      steps:
      - Authorize the supplied context before lookup.
      - Validate the identity and invoke OP-TASK-GET.
      - Refuse missing task.
      - If pending, apply the entity transition and invoke OP-TASK-SAVE.
      - If already completed, return unchanged without another save.
      preconditions: []
      postconditions: []
      effects:
      - A pending retained task becomes completed on confirmed success.
      graph_refs:
      - GRAPH-TASK-003
    failures:
    - id: FAIL-TASK-003-AUTH
      condition: Context absent, unresolved, unknown or insufficient.
      result: PermissionError.
      effects: No task capability is called.
      outcome_certainty: not_applied
    - id: FAIL-TASK-003-STORE
      condition: A selected persistence operation fails.
      result: Propagate the failure.
      effects: Do not infer a successful write or safe retry from an unavailable result.
      outcome_certainty: unknown
    - id: FAIL-TASK-003-DATA
      condition: Raw title or task identity violates the declared data contract.
