      effects: No forbidden domain mutation.
      outcome_certainty: not_applied
    domain_ref: DOMAIN-TASK-MANAGEMENT
  rules:
  - id: RULE-TASK-ID
    statement: Task identity is nonempty text and is preserved after construction.
    owner_ref: ENT-TASK
    origin_refs: []
    kind: invariant
  - id: RULE-TASK-TITLE
    statement: Canonical title is stripped text with 1 through 120 characters.
    owner_ref: ENT-TASK
    origin_refs: []
    kind: invariant
  - id: RULE-TASK-COMPLETED
    statement: Completion is boolean; completion preserves identity and title.
    owner_ref: ENT-TASK
    origin_refs: []
    kind: transition
  - id: RULE-ACTOR-CONTEXT
    statement: Caller identity is text or absent, permissions are a tuple of text, resolution is text and known_actor
      is boolean.
    owner_ref: ENT-ACTOR-CONTEXT
    origin_refs: []
    kind: invariant
  - id: RULE-TASK-001-AUTH
    statement: Require resolved, known, nonblank caller identity and tasks:create before protected effects.
    owner_ref: UC-TASK-001
    origin_refs: []
    kind: authorization
  - id: RULE-TASK-002-AUTH
    statement: Require resolved, known, nonblank caller identity and tasks:read before protected effects.
    owner_ref: UC-TASK-002
    origin_refs: []
    kind: authorization
  - id: RULE-TASK-003-AUTH
