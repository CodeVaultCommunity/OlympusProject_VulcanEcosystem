name: Verify Vulcan Stable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python: ['3.11', '3.12']
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r scripts/requirements-dev.txt
      - run: python scripts/check_repository.py
      - run: python -m pytest scripts/tests
      - run: python -m pip install -e "versioning/Stable-v1.0.0"
      - run: python versioning/Stable-v1.0.0/run_examples.py
      - run: python versioning/Stable-v1.0.0/scripts/validate_ecosystem.py
      - run: python -m pytest versioning/Stable-v1.0.0/tests
      - run: python scripts/content_inventory.py --check
