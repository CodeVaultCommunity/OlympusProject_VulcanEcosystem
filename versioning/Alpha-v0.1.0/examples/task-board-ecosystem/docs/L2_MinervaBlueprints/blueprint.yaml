      to: NODE-001-FAIL
      condition: Context is not permitted.
      action: ''
    - id: EDGE-001-3
      from: NODE-001-AUTHORIZE
      to: NODE-001-EXECUTE
      condition: Context satisfies the case policy.
      action: ''
    - id: EDGE-001-4
      from: NODE-001-EXECUTE
      to: NODE-001-FAIL
      condition: A specified data, absence or storage failure occurs.
      action: ''
    - id: EDGE-001-5
      from: NODE-001-EXECUTE
