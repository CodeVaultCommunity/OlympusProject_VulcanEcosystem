      ready_entity_assumption: Ready entities already satisfy canonical invariants. Validated scalar inputs retain
        their preconditions; no duplicate domain validation in this tool.
      canonical_construction_refs: []
      revalidates_rule_refs: []
      contextual_conditions:
      - {id: CTX-OP-BOOKING-SAVE, condition: 'A successful save confirms one updated retained booking.

          Expected version zero means insert only if the identifier is absent. A positive expected version means
          replace only the matching retained version. Comparison and write are atomic; success increments the version
          by one.

          VERSION_CONFLICT guarantees this operation made no change; another concurrent operation may have changed
