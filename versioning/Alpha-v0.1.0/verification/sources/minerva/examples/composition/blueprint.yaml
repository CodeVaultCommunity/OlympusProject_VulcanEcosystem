      - {id: FAIL-OP-BOOKING-SAVE-STORE-UNAVAILABLE, condition: The store did not confirm the write., result: 'STORE_UNAVAILABLE:
          Distinguish write_outcome=not_applied, when supported by a no-write guarantee, from unknown. Do not report
