  case_ids: [UC-TASK-CREATE, UC-TASK-COMPLETE, UC-TASK-LIST]
  sha256: fa14749cf58a179792ee66231e413cd912ddf944174824919b8c4615e91d87c8
  catalog:
  - {ref: ACT-BOARD-MEMBER, kind: actor, statement: Board member, source_pointer: /atlas/actors/0}
  - {ref: ENT-TASK, kind: entity, statement: Task, source_pointer: /atlas/entities/0}
  - {ref: FLD-TASK-ID, kind: field, statement: Task identifier, source_pointer: /atlas/entities/0/fields/0}
  - {ref: FLD-TASK-TITLE, kind: field, statement: Title, source_pointer: /atlas/entities/0/fields/1}
  - {ref: FLD-TASK-STATUS, kind: field, statement: Status, source_pointer: /atlas/entities/0/fields/2}
  - {ref: FLD-TASK-REVISION, kind: field, statement: Revision, source_pointer: /atlas/entities/0/fields/3}
  - {ref: VLD-TASK-ID, kind: validation, statement: 'A task identifier is non-empty text, preserved exactly.', source_pointer: /atlas/entities/0/validations/0}
  - {ref: VLD-TASK-NEW, kind: validation, statement: 'A new Task has a valid identifier, a meaningful title, open
      status, and revision zero.', source_pointer: /atlas/entities/0/validations/1}
  - {ref: VLD-TASK-COMPLETE, kind: validation, statement: A ready Task may transition from open to completed; a
      completed Task cannot be completed again., source_pointer: /atlas/entities/0/validations/2}
  - {ref: TOL-TASK-STORE, kind: tool, statement: Task store, source_pointer: /atlas/tools/0}
  - {ref: OP-TASK-CREATE, kind: operation, statement: Retain a new Task, source_pointer: /atlas/tools/0/operations/0}
  - {ref: OP-TASK-LOAD, kind: operation, statement: Read one Task, source_pointer: /atlas/tools/0/operations/1}
  - {ref: OP-TASK-COMPLETE, kind: operation, statement: Retain a completion, source_pointer: /atlas/tools/0/operations/2}
  - {ref: OP-TASK-LIST, kind: operation, statement: Read the board, source_pointer: /atlas/tools/0/operations/3}
  - ref: UC-TASK-CREATE
    kind: case
    statement: Create task
    source_pointer: /atlas/use_cases/0
    actor_refs: [ACT-BOARD-MEMBER]
  - ref: RF-TASK-CREATE-AUTH
    kind: requirement
    statement: 'Resolve the initiating board member and require task.create for the selected board in trusted caller
      context. Missing, unresolved, expired, or insufficient context is denied before any entity application or
      tool call. No anonymous execution is permitted. Origin: SRC-TASK-BRIEF.'
    source_pointer: /atlas/use_cases/0/functional_requirements/0
    case_refs: [UC-TASK-CREATE]
  - ref: RF-TASK-CREATE-DATA
    kind: requirement
    statement: After authorization, construct a new Task from task_id and title with status open and revision zero,
      applying VLD-TASK-NEW. An invalid candidate is refused before storage; preserve input text exactly.
    source_pointer: /atlas/use_cases/0/functional_requirements/1
    case_refs: [UC-TASK-CREATE]
  - ref: RF-TASK-CREATE-RETAIN
    kind: requirement
    statement: Pass the ready Task and authorized board to OP-TASK-CREATE once. Only a confirmed result returns
      the retained identifier, title, open status, and revision zero.
    source_pointer: /atlas/use_cases/0/functional_requirements/2
    case_refs: [UC-TASK-CREATE]
  - ref: RF-TASK-CREATE-DUPLICATE
    kind: requirement
    statement: Map DUPLICATE_ID to duplicate-identifier refusal. Preserve the existing Task and do not choose a
      replacement identifier silently.
    source_pointer: /atlas/use_cases/0/functional_requirements/3
    case_refs: [UC-TASK-CREATE]
  - ref: RF-TASK-CREATE-FAILURE
    kind: requirement
    statement: On STORE_UNAVAILABLE, report write_outcome supplied by the tool. Distinguish not_applied from unknown;
      never infer no change or success from an absent confirmation and do not retry automatically.
    source_pointer: /atlas/use_cases/0/functional_requirements/4
    case_refs: [UC-TASK-CREATE]
  - ref: RNF-TASK-CREATE-RETENTION
    kind: requirement
    statement: 'A confirmed creation remains readable after a normal store restart. Origin: SRC-TASK-BRIEF (synthetic
      teaching brief).'
    source_pointer: /atlas/use_cases/0/nonfunctional_requirements/0
    case_refs: [UC-TASK-CREATE]
  - ref: AC-TASK-CREATE-AUTH
    kind: criterion
    statement: Try absent context, an unresolved identity, an expired context, and a member lacking this permission.
      Every attempt is denied before tool invocation, with no task state or existence disclosed.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/0
    case_refs: [UC-TASK-CREATE]
  - ref: AC-TASK-CREATE-SUCCESS
    kind: criterion
    statement: With trusted create permission and unused TASK001 / Review Atlas, receive the exact open Task at
      revision zero; a later successful list includes it once.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/1
    case_refs: [UC-TASK-CREATE]
  - ref: AC-TASK-CREATE-INVALID
    kind: criterion
    statement: An empty title or whitespace-only identifier is refused before OP-TASK-CREATE is invoked.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/2
    case_refs: [UC-TASK-CREATE]
  - ref: AC-TASK-CREATE-DUPLICATE
    kind: criterion
    statement: Creating TASK001 twice retains the first Task unchanged and returns duplicate-identifier refusal
      on the second attempt.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/3
    case_refs: [UC-TASK-CREATE]
  - ref: AC-TASK-CREATE-UNKNOWN
    kind: criterion
    statement: Inject a write with lost confirmation. The case reports unknown; it does not claim no write, report
      success, or initiate a retry.
    source_pointer: /atlas/use_cases/0/acceptance_criteria/4
    case_refs: [UC-TASK-CREATE]
  - ref: UC-TASK-COMPLETE
    kind: case
    statement: Complete task
    source_pointer: /atlas/use_cases/1
    actor_refs: [ACT-BOARD-MEMBER]
  - ref: RF-TASK-COMPLETE-AUTH
    kind: requirement
    statement: 'Resolve the initiating board member and require task.complete for the selected board in trusted
      caller context. Missing, unresolved, expired, or insufficient context is denied before any entity application
      or tool call. No anonymous execution is permitted. Origin: SRC-TASK-BRIEF.'
    source_pointer: /atlas/use_cases/1/functional_requirements/0
    case_refs: [UC-TASK-COMPLETE]
  - ref: RF-TASK-COMPLETE-ID
    kind: requirement
    statement: After authorization, apply VLD-TASK-ID to the supplied identifier; refuse invalid input before tool
      access.
    source_pointer: /atlas/use_cases/1/functional_requirements/1
    case_refs: [UC-TASK-COMPLETE]
  - ref: RF-TASK-COMPLETE-LOAD
    kind: requirement
    statement: Read a ready Task and its observed revision with OP-TASK-LOAD. A confirmed NOT_FOUND is a refusal
      without write, distinct from unavailable or malformed storage.
    source_pointer: /atlas/use_cases/1/functional_requirements/2
    case_refs: [UC-TASK-COMPLETE]
  - ref: RF-TASK-COMPLETE-TRANSITION
    kind: requirement
    statement: Apply VLD-TASK-COMPLETE to the ready Task's current state. If already completed, refuse without writing.
      Otherwise produce a ready completed Task preserving identifier/title; do not repeat validation of its established
      invariants.
    source_pointer: /atlas/use_cases/1/functional_requirements/3
    case_refs: [UC-TASK-COMPLETE]
  - ref: RF-TASK-COMPLETE-WRITE
    kind: requirement
    statement: Call OP-TASK-COMPLETE with the completed Task and observed revision. Confirm only its successful
      result. NOT_FOUND or VERSION_CONFLICT refuses with no write by this operation; never overwrite a competing
      change.
    source_pointer: /atlas/use_cases/1/functional_requirements/4
    case_refs: [UC-TASK-COMPLETE]
  - ref: RF-TASK-COMPLETE-FAILURE
    kind: requirement
    statement: Propagate read unavailable/invalid-state failures without a write. On a write's STORE_UNAVAILABLE
      preserve not_applied versus unknown; do not claim completion or retry automatically.
    source_pointer: /atlas/use_cases/1/functional_requirements/5
    case_refs: [UC-TASK-COMPLETE]
  - ref: RNF-TASK-COMPLETE-ATOMICITY
    kind: requirement
    statement: 'Concurrent completion must not lose an update or report two writes for the same observed revision.
      Origin: SRC-TASK-BRIEF (synthetic teaching brief).'
    source_pointer: /atlas/use_cases/1/nonfunctional_requirements/0
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-AUTH
    kind: criterion
    statement: Try absent context, an unresolved identity, an expired context, and a member lacking this permission.
      Every attempt is denied before tool invocation, with no task state or existence disclosed.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/0
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-SUCCESS
    kind: criterion
    statement: For TASK001 open at revision zero, completion returns the same identifier/title, completed status
      and revision one; later listing reflects that state.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/1
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-MISSING
    kind: criterion
    statement: A confirmed absent identifier produces not-found without calling OP-TASK-COMPLETE.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/2
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-INVALID
    kind: criterion
    statement: An empty or whitespace-only identifier is refused before load or completion tools are invoked.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/3
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-ALREADY
    kind: criterion
    statement: A ready completed Task produces already-completed refusal and no write; its revision remains unchanged.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/4
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-CONFLICT
    kind: criterion
    statement: Change the retained revision between load and completion. Return VERSION_CONFLICT, preserving the
      competing state.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/5
    case_refs: [UC-TASK-COMPLETE]
  - ref: AC-TASK-COMPLETE-UNKNOWN
    kind: criterion
    statement: Lose the completion confirmation after issuing a write. Return unknown without success/no-change
      claims or automatic retry.
    source_pointer: /atlas/use_cases/1/acceptance_criteria/6
    case_refs: [UC-TASK-COMPLETE]
  - ref: UC-TASK-LIST
    kind: case
    statement: List tasks
    source_pointer: /atlas/use_cases/2
    actor_refs: [ACT-BOARD-MEMBER]
  - ref: RF-TASK-LIST-AUTH
    kind: requirement
    statement: 'Resolve the initiating board member and require task.list for the selected board in trusted caller
      context. Missing, unresolved, expired, or insufficient context is denied before any entity application or
      tool call. No anonymous execution is permitted. Origin: SRC-TASK-BRIEF.'
    source_pointer: /atlas/use_cases/2/functional_requirements/0
    case_refs: [UC-TASK-LIST]
  - ref: RF-TASK-LIST-SNAPSHOT
    kind: requirement
    statement: After authorization, call OP-TASK-LIST for the trusted board. Return every ready Task exactly once
      in the declared identifier order, preserving title, state, and revision. A confirmed empty snapshot is a successful
      empty list. Do not revalidate ready entities.
    source_pointer: /atlas/use_cases/2/functional_requirements/1
    case_refs: [UC-TASK-LIST]
  - ref: RF-TASK-LIST-FAILURE
    kind: requirement
    statement: Report unavailable or invalid-state retrieval as a failure, preserving its distinction. Do not return
      an empty or partial success and make no task changes.
    source_pointer: /atlas/use_cases/2/functional_requirements/2
    case_refs: [UC-TASK-LIST]
  - ref: RNF-TASK-LIST-CONSISTENCY
    kind: requirement
    statement: 'The list represents one consistent snapshot of the authorized board. Origin: SRC-TASK-BRIEF (synthetic
      teaching brief).'
    source_pointer: /atlas/use_cases/2/nonfunctional_requirements/0
    case_refs: [UC-TASK-LIST]
  - ref: RNF-TASK-LIST-RETENTION
    kind: requirement
    statement: 'A confirmed creation remains readable after a normal store restart. Origin: SRC-TASK-BRIEF (synthetic
      teaching brief).'
    source_pointer: /atlas/use_cases/2/nonfunctional_requirements/1
    case_refs: [UC-TASK-LIST]
  - ref: AC-TASK-LIST-AUTH
    kind: criterion
    statement: Try absent context, an unresolved identity, an expired context, and a member lacking this permission.
      Every attempt is denied before tool invocation, with no task state or existence disclosed.
    source_pointer: /atlas/use_cases/2/acceptance_criteria/0
    case_refs: [UC-TASK-LIST]
  - ref: AC-TASK-LIST-CONTENT
    kind: criterion
    statement: Given open TASK002 and completed TASK001, return TASK001 then TASK002 with exact fields, once each,
      with no state or revision changed.
    source_pointer: /atlas/use_cases/2/acceptance_criteria/1
    case_refs: [UC-TASK-LIST]
  - ref: AC-TASK-LIST-EMPTY
    kind: criterion
    statement: A successful consistent read of an empty authorized board returns an empty list and changes no task
      state or revision; an unavailable store instead returns failure, never a falsely empty success.
    source_pointer: /atlas/use_cases/2/acceptance_criteria/2
    case_refs: [UC-TASK-LIST]
  - ref: AC-TASK-LIST-INTEGRITY
    kind: criterion
    statement: If hydration finds an invalid stored Task, report STORE_INVALID_STATE without publishing a partial
      successful list.
    source_pointer: /atlas/use_cases/2/acceptance_criteria/3
    case_refs: [UC-TASK-LIST]
adpm:
  types:
  - id: TYP-TASK-STATUS
    base: string
    constraints: [Exactly open or completed.]
  - id: TYP-RESOLVED-BOARD
    base: string
    constraints: ['Trusted opaque board identifier, bound to the invocation by the identity authority; never accepted
        from untrusted business input.']
  entities:
  - id: ENT-TASK
    source_entity_id: ENT-TASK
    name: Task
    meaning: A unit of work retained in one board. Its identity and title survive completion. The entity owns data
      validity and state-transition rules; it has no tool or use-case dependency.
    fields:
    - name: task_identifier
      description: 'Identity within this board. Constraints: Non-empty, non-whitespace text; equality is exact and
        case-sensitive.'
      type: {kind: primitive, name: string}
      required: true
      cardinality: '1'
    - name: title
      description: 'The work to be remembered. Constraints: At least one non-whitespace character; retain the original
        text.'
      type: {kind: primitive, name: string}
      required: true
      cardinality: '1'
    - name: status
      description: 'Lifecycle state. Constraints: One of open or completed.'
      type: {kind: type, ref: TYP-TASK-STATUS}
      required: true
      cardinality: '1'
    - name: revision
      description: 'Concurrency token for a retained Task. Constraints: A non-negative integer, increased by one
        for each successful completion.'
      type: {kind: primitive, name: integer}
      required: true
      cardinality: '1'
    invariant_refs: [VLD-TASK-ID, VLD-TASK-NEW]
    construction: Canonical construction/hydration enforces all field constraints and state coherence once. Named
      transition rules apply only to their declared transition, not to every hydrated entity.
    behavior:
      summary: Preserve identity, exact data and the declared lifecycle.
      steps: ['A task identifier is non-empty text, preserved exactly.', 'A new Task has a valid identifier, a meaningful
          title, open status, and revision zero.', A ready Task may transition from open to completed; a completed
          Task cannot be completed again.]
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: [GRAPH-VLD-TASK-ID, GRAPH-VLD-TASK-NEW, GRAPH-VLD-TASK-COMPLETE]
    dependencies: []
  - id: ENT-CALLER-CONTEXT
    source_entity_id: null
    name: Caller context
    meaning: L2 invocation data, distinct from business inputs and injected tools.
    fields:
    - name: principal
      description: Authenticated concrete caller identity.
      type: {kind: primitive, name: string}
      required: true
    - name: issuer
      description: Trusted context issuer.
      type: {kind: primitive, name: string}
      required: true
    - name: valid
      description: Context is resolved, known and unexpired.
      type: {kind: primitive, name: boolean}
      required: true
    - name: permissions
      description: Case permissions from the trusted authority.
      type:
        kind: array
        items: {kind: primitive, name: string}
      required: true
    - name: board
      description: Authorized board binding; fixed for this invocation and forwarded calls.
      type: {kind: primitive, name: string}
      required: true
    invariant_refs: [RULE-CALLER-CONTEXT]
    construction: Created by the selected trusted authority; a matching request shape does not establish trust.
    behavior:
      summary: Carry caller identity and grants; each case decides its own authorization.
      steps: []
      preconditions: []
      postconditions: []
      effects: []
      graph_refs: []
    dependencies: []
  tools:
  - id: TOL-TASK-STORE
    name: Task store
    purpose: An abstract retention and retrieval capability. This specification chooses no database, protocol, framework,
      SQL syntax, route, or concrete adapter.
    operations:
    - id: OP-TASK-CREATE
      name: Retain a new Task
      purpose: Atomically insert one ready open Task if its identifier is absent.
      inputs:
      - name: task
        description: Ready Task after VLD-TASK-NEW; revision zero.
        type: {kind: entity, ref: ENT-TASK}
        required: true
      - name: board
        description: The board bound to trusted caller context.
        type: {kind: type, ref: TYP-RESOLVED-BOARD}
        required: true
      outputs:
      - name: created_task
        description: The retained Task, with its exact title and identifier.
        type: {kind: entity, ref: ENT-TASK}
        required: true
      conditions: [A Task input is already valid according to ENT-TASK. Tools consume ready entities and do not
          repeat entity-invariant validation. Loading raw records uses the canonical entity construction/hydration
          boundary once; this is not duplicate validation of a ready Task., All operations act on the board resolved
          in the trusted caller context. A caller supplies no untrusted substitute for that board binding.]
      guarantees: [Uniqueness check and insertion are atomic. A duplicate does not overwrite an existing Task.,
        A Task input is already valid according to ENT-TASK. Tools consume ready entities and do not repeat entity-invariant
          validation. Loading raw records uses the canonical entity construction/hydration boundary once; this is
          not duplicate validation of a ready Task., A successful result confirms retention at revision zero.]
      effects: [One Task is added on success.]
      failures:
      - {id: FAIL-OP-TASK-CREATE-DUPLICATE-ID, condition: The identifier is already retained in this board., result: 'DUPLICATE_ID:
          This outcome is not applied: the store guarantees that this operation made no change.', effects: 'This
          outcome is not applied: the store guarantees that this operation made no change.', outcome_certainty: not_applied}
      - {id: FAIL-OP-TASK-CREATE-STORE-UNAVAILABLE, condition: The capability could not confirm the requested result.,
        result: 'STORE_UNAVAILABLE: For a write, return write_outcome=not_applied only with evidence no write occurred;
          otherwise return write_outcome=unknown. Unknown is neither success nor proof of no change, and must not
          be automatically retried. A read failure returns no usable snapshot and changes no task.', effects: 'For
          a write, return write_outcome=not_applied only with evidence no write occurred; otherwise return write_outcome=unknown.
          Unknown is neither success nor proof of no change, and must not be automatically retried. A read failure
          returns no usable snapshot and changes no task.', outcome_certainty: unknown}
      ready_entity_assumption: Ready entities already satisfy canonical invariants. Validated scalar inputs retain
        their preconditions; no duplicate domain validation in this tool.
      canonical_construction_refs: []
      revalidates_rule_refs: []
      contextual_conditions:
      - {id: CTX-OP-TASK-CREATE, condition: 'Uniqueness check and insertion are atomic. A duplicate does not overwrite
          an existing Task.

          A Task input is already valid according to ENT-TASK. Tools consume ready entities and do not repeat entity-invariant
          validation. Loading raw records uses the canonical entity construction/hydration boundary once; this is
          not duplicate validation of a ready Task.', object: The persisted identifier and any expected version.,
        purpose: Enforce atomic external storage conditions without repeating ready-entity validity., responsibility: OP-TASK-CREATE}
    - id: OP-TASK-LOAD
      name: Read one Task
      purpose: Return a ready Task and its observed revision by exact identifier.
      inputs:
      - name: task_identifier
        description: Identifier already checked against VLD-TASK-ID.
        type: {kind: primitive, name: string}
        required: true
      - name: board
        description: The authorized board.
        type: {kind: type, ref: TYP-RESOLVED-BOARD}
        required: true
      outputs:
      - name: task
        description: A ready Task hydrated from one retained record.
        type: {kind: entity, ref: ENT-TASK}
        required: true
      conditions: [A Task input is already valid according to ENT-TASK. Tools consume ready entities and do not
          repeat entity-invariant validation. Loading raw records uses the canonical entity construction/hydration
          boundary once; this is not duplicate validation of a ready Task., All operations act on the board resolved
          in the trusted caller context. A caller supplies no untrusted substitute for that board binding.]
      guarantees: ['No write occurs. Not-found is a confirmed absence, not a masked read error.', A Task input is
          already valid according to ENT-TASK. Tools consume ready entities and do not repeat entity-invariant validation.
          Loading raw records uses the canonical entity construction/hydration boundary once; this is not duplicate
          validation of a ready Task., Its revision describes the same observed record as its fields.]
      effects: [No task is changed.]
      failures:
      - {id: FAIL-OP-TASK-LOAD-NOT-FOUND, condition: No task with this identifier exists in this board at read time.,
        result: 'NOT_FOUND: Distinct from unavailable or malformed storage.', effects: Distinct from unavailable
          or malformed storage., outcome_certainty: not_applicable}
      - {id: FAIL-OP-TASK-LOAD-STORE-UNAVAILABLE, condition: The capability could not confirm the requested result.,
        result: 'STORE_UNAVAILABLE: For a write, return write_outcome=not_applied only with evidence no write occurred;
          otherwise return write_outcome=unknown. Unknown is neither success nor proof of no change, and must not
          be automatically retried. A read failure returns no usable snapshot and changes no task.', effects: 'For
          a write, return write_outcome=not_applied only with evidence no write occurred; otherwise return write_outcome=unknown.
          Unknown is neither success nor proof of no change, and must not be automatically retried. A read failure
          returns no usable snapshot and changes no task.', outcome_certainty: not_applicable}
      - {id: FAIL-OP-TASK-LOAD-STORE-INVALID-STATE, condition: A stored record could not be hydrated through the
          canonical Task validity rules., result: 'STORE_INVALID_STATE: Do not return a malformed ready Task, an
          empty success, or a partial list. Report the integrity failure; no task is changed by the read.', effects: 'Do
          not return a malformed ready Task, an empty success, or a partial list. Report the integrity failure;
          no task is changed by the read.', outcome_certainty: not_applicable}
      ready_entity_assumption: Ready entities already satisfy canonical invariants. Validated scalar inputs retain
        their preconditions; no duplicate domain validation in this tool.
      canonical_construction_refs: [ENT-TASK]
      revalidates_rule_refs: []
      contextual_conditions: []
    - id: OP-TASK-COMPLETE
      name: Retain a completion
      purpose: Atomically replace the observed Task with a ready completed Task only if its revision still matches.
      inputs:
      - name: task
        description: Ready Task after the entity's open-to-completed transition; identity/title unchanged.
        type: {kind: entity, ref: ENT-TASK}
        required: true
      - name: expected_revision
        description: Revision returned by OP-TASK-LOAD.
        type: {kind: primitive, name: integer}
