  cases:
  - id: UC-BOOKING-LOOKUP
    source_case_id: UC-BOOKING-LOOKUP
    app: BookingDesk
    name: Locate booking
    objective: Return the current data of one retained booking.
    inputs:
    - name: actor_context
      description: 'The lookup is used directly by the desk and by cancellation.

        Caller context must contain a resolved authenticated principal, the relevant case permissions, and a validity
        status. Its origin is the application''s trusted identity-and-permission authority; request fields and caller-supplied
        role strings are not trusted authorization evidence. Anonymous execution is not permitted. Missing, unresolved,
        expired or insufficient context is denied before any validation, tool access or effect.

        The initiating actor is ACT-BOOKING-CLERK. The actor is a role; the caller is the concrete principal. The
        identity/authentication mechanism and channel encoding remain later design decisions.'
      type: {kind: entity, ref: ENT-CALLER-CONTEXT, nullable: true}
      required: true
    - name: booking_code
      description: The code to locate.
      type: {kind: primitive, name: string}
      required: true
    outputs:
    - name: result
      description: The booking is returned.
      type: {kind: entity, ref: ENT-BOOKING}
      required: true
    collaborators: [ENT-BOOKING, TOL-BOOKING-STORE, OP-BOOKING-LOAD]
    rule_refs: [RULE-BOOKING-LOOKUP-AUTH, VLD-BOOKING-CODE]
    permission:
      context_input: actor_context
      trust_source: 'The lookup is used directly by the desk and by cancellation.

        Caller context must contain a resolved authenticated principal, the relevant case permissions, and a validity
        status. Its origin is the application''s trusted identity-and-permission authority; request fields and caller-supplied
        role strings are not trusted authorization evidence. Anonymous execution is not permitted. Missing, unresolved,
        expired or insufficient context is denied before any validation, tool access or effect.

        The initiating actor is ACT-BOOKING-CLERK. The actor is a role; the caller is the concrete principal. The
        identity/authentication mechanism and channel encoding remain later design decisions.'
      required_permissions: [Permitted to locate bookings.]
      allowed_actor_refs: [ACT-BOOKING-CLERK]
      deny_contexts: [absent, unresolved, unknown, insufficient]
      anonymous_allowed: false
      authentication: Authenticated, resolved, known and unexpired principal required; channel mechanism remains
        unselected.
      before_effects: true
    behavior:
      summary: Return the current data of one retained booking.
      steps: [Resolve and authorize the initiating caller first (RF-BOOKING-LOOKUP-AUTH). Denial terminates before
          any subsequent step., Validate the code (RF-BOOKING-LOOKUP-01). An invalid code is refused before load.,
        Load through OP-BOOKING-LOAD (RF-BOOKING-LOOKUP-02). NOT_FOUND is a refusal (RF-BOOKING-LOOKUP-03); STORE_UNAVAILABLE
          is a failure (RF-BOOKING-LOOKUP-04).]
      preconditions: [Requests may arrive without valid caller context; the explicit denial path handles them before
