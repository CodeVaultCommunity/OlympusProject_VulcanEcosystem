    owner_ref: ENT-REQUEST
    origin_refs: [VLD-REQUEST-CODE]
    kind: invariant
  - id: RULE-CALLER-CONTEXT
    statement: Context fields preserve the declared principal, issuer, validity and permissions. Trust is an external
